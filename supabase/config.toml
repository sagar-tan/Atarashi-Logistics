project_id = "atarashi-logistics"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081"]
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Atarashi verification code is {{ .Code }}"

[storage]
enabled = true
